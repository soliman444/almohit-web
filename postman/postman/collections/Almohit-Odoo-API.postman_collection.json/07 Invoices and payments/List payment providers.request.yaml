$kind: http-request
description: اختياري invoice_id لتصفية المزودين حسب مبلغ الفاتورة.
url: "{{baseUrl}}/almohit/api/payment/providers"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: invoice_id
    value: "{{invoiceId}}"
    disabled: true
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {

        pm.collectionVariables.set("providerId", String(json.data[0].id));

      }
    language: text/javascript
order: 3000
