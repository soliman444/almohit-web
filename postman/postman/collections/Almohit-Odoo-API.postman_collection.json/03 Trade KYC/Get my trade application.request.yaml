$kind: http-request
description: آخر طلب تجاري للحساب الحالي. Portal.
url: "{{baseUrl}}/almohit/api/trade/application"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && json.data && json.data.id != null) {

        pm.collectionVariables.set("applicationId", String(json.data.id));

      }
    language: text/javascript
order: 1000
