$kind: http-request
url: "{{baseUrl}}/almohit/api/admin/brands"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Brand"
    }
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && json.data && json.data.id != null) {

        pm.collectionVariables.set("brandId", String(json.data.id));

      }
    language: text/javascript
order: 9000
