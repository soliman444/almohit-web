$kind: http-request
description: منتج بسيط. غيّر category_id إلى تصنيف موجود.
url: "{{baseUrl}}/almohit/api/admin/products"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Product",
      "sku": "PM-TEST-001",
      "description": "Created from Postman",
      "category_id": "{{categoryId}}",
      "min_order_qty": 1,
      "sale_ok": true,
      "wholesale_price": 10,
      "cost": 6,
      "quantity": 20
    }
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && json.data && json.data.id != null) {

        pm.collectionVariables.set("productId", String(json.data.id));

      }
    language: text/javascript
order: 5000
