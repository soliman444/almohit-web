$kind: http-request
url: "{{baseUrl}}/almohit/api/admin/products"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: ""
    disabled: true
  - key: category_id
    value: "{{categoryId}}"
    disabled: true
  - key: status
    value: sale
    disabled: true
  - key: type
    value: product
    disabled: true
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {

        pm.collectionVariables.set("productId", String(json.data[0].id));

      }
    language: text/javascript
order: 3000
