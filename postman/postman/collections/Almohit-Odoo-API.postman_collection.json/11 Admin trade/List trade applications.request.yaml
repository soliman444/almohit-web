$kind: http-request
url: "{{baseUrl}}/almohit/api/admin/trade/applications"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: ""
    disabled: true
  - key: status
    value: pending
    disabled: true
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {

        pm.collectionVariables.set("applicationId", String(json.data[0].id));

      }
    language: text/javascript
order: 1000
