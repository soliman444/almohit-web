$kind: http-request
description: كتالوج عام. الأسعار تظهر فقط لعميل معتمد في الجلسة.
url: "{{baseUrl}}/almohit/api/products"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {

        pm.collectionVariables.set("productId", String(json.data[0].id));

      }
    language: text/javascript
order: 2000
