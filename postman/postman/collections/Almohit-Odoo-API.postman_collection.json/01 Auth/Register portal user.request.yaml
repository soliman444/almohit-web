$kind: http-request
description: "إنشاء حساب بوابة. role: merchant | buyer | distributor | marketer. لا يسجّل الدخول تلقائياً."
url: "{{baseUrl}}/almohit/api/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Merchant",
      "email": "{{portalEmail}}",
      "password": "{{portalPassword}}",
      "phone": "+967700000000",
      "role": "merchant"
    }
order: 1000
