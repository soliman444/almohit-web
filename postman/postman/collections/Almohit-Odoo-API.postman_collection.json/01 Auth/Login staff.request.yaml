$kind: http-request
description: يسجّل دخول موظف أودو الداخلي. استخدمه قبل مجلدات Admin.
url: "{{baseUrl}}/almohit/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}"
    }
scripts:
  - type: afterResponse
    code: |
      const json = pm.response.json();

      if (json && json.ok && json.data && json.data.session_id) {

        pm.collectionVariables.set("sessionId", json.data.session_id);

      }

      const cookies = pm.response.headers.all().filter((h) => h.key.toLowerCase() === "set-cookie");

      for (const header of cookies) {

        const match = String(header.value).match(/session_id=([^;]+)/);

        if (match) {

          pm.collectionVariables.set("sessionId", match[1]);

          break;

        }

      }
    language: text/javascript
order: 3000
