$kind: http-request
description: إنهاء الجلسة. بعد النجاح أفرغ sessionId يدوياً أو أعد Login.
url: "{{baseUrl}}/almohit/api/auth/logout"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |
      pm.collectionVariables.set("sessionId", "");
    language: text/javascript
order: 5000
