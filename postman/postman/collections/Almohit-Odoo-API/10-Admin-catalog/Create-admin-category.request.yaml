$kind: http-request
name: Create admin category
order: 7000
method: POST
url: '{{baseUrl}}/almohit/api/admin/categories'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "name": "Postman Category",
        "parent_id": null
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && json.data && json.data.id != null) {
      
        pm.collectionVariables.set("categoryId", String(json.data.id));
      
      }
      
