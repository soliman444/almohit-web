$kind: http-request
name: List admin products
order: 3000
method: GET
url: '{{baseUrl}}/almohit/api/admin/products'
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: q
    value: ''
    disabled: true
  - key: category_id
    value: '{{categoryId}}'
    disabled: true
  - key: status
    value: sale
    disabled: true
  - key: type
    value: product
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("productId", String(json.data[0].id));
      
      }
      
