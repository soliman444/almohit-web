$kind: http-request
name: Add cart item
order: 2000
method: POST
url: '{{baseUrl}}/almohit/api/cart/items'
description: product_id هو معرف product.product (المتغير) وليس القالب دائماً. خذ id من تفاصيل المنتج.
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "product_id": "{{productId}}",
        "quantity": 5
      }
