$kind: http-request
name: List trade applications
order: 1000
method: GET
url: '{{baseUrl}}/almohit/api/admin/trade/applications'
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: q
    value: ''
    disabled: true
  - key: status
    value: pending
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("applicationId", String(json.data[0].id));
      
      }
      
