$kind: http-request
name: List payment providers
order: 3000
method: GET
url: '{{baseUrl}}/almohit/api/payment/providers'
description: اختياري invoice_id لتصفية المزودين حسب مبلغ الفاتورة.
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: invoice_id
    value: '{{invoiceId}}'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("providerId", String(json.data[0].id));
      
      }
      
