$kind: http-request
name: Start invoice payment
order: 4000
method: POST
url: '{{baseUrl}}/almohit/api/invoices/{{invoiceId}}/payment'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "provider_id": "{{providerId}}"
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && json.data && json.data.id != null) {
      
        pm.collectionVariables.set("transactionId", String(json.data.id));
      
      }
      
