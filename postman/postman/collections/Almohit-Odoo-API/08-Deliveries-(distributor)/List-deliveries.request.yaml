$kind: http-request
name: List deliveries
order: 1000
method: GET
url: '{{baseUrl}}/almohit/api/deliveries'
description: فقط حساب موزع معتمد.
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("deliveryId", String(json.data[0].id));
      
      }
      
