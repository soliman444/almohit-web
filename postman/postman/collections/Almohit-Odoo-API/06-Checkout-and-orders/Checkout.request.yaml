$kind: http-request
name: Checkout
order: 1000
method: POST
url: '{{baseUrl}}/almohit/api/checkout'
description: يحول سلة المسودة إلى طلب مؤكد. املأ عناوين موجودة.
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "shipping_address_id": "{{shippingAddressId}}",
        "invoice_address_id": "{{invoiceAddressId}}"
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && json.data && json.data.id != null) {
      
        pm.collectionVariables.set("orderId", String(json.data.id));
      
      }
      
