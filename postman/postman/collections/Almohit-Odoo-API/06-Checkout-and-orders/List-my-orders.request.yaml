$kind: http-request
name: List my orders
order: 2000
method: GET
url: '{{baseUrl}}/almohit/api/orders'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("orderId", String(json.data[0].id));
      
      }
      
