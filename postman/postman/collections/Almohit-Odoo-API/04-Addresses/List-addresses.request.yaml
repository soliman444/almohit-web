$kind: http-request
name: List addresses
order: 1000
method: GET
url: '{{baseUrl}}/almohit/api/addresses'
description: عناوين الشحن والفاتورة. Portal.
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      
      if (json && json.ok && Array.isArray(json.data) && json.data[0] && json.data[0].id != null) {
      
        pm.collectionVariables.set("addressId", String(json.data[0].id));
      
      }
      
