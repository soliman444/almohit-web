$kind: http-request
name: Logout
order: 5000
method: POST
url: '{{baseUrl}}/almohit/api/auth/logout'
description: إنهاء الجلسة. بعد النجاح أفرغ sessionId يدوياً أو أعد Login.
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set("sessionId", "");
      
